services:
  - type: web
    name: cheat-clip-pro-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/cookies
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPADATA_API_KEYS
        sync: false
      - key: YOUTUBE_COOKIES_B64
        sync: false
